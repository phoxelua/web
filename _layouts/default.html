<!DOCTYPE html>
<html lang="en">
<script>
(function(){
var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');
if(location.hash)document.documentElement.style.scrollBehavior='auto';
})();
</script>

  {% include head.html %}
  {% include google_analytics.html %}

    <body id="page-top">

    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Howard Nguyen",
      "url": "{{ site.url }}",
      "email": "{{ site.email }}",
      "jobTitle": "Senior Software Engineer",
      "description": "{{ site.description }}",
      "alumniOf": {
        "@type": "Organization",
        "name": "UC Berkeley"
      },
      "worksFor": {
        "@type": "Organization",
        "name": "Pinterest"
      },
      "sameAs": [
        {% for network in site.social %}"{{ network.url }}"{% unless forloop.last %},{% endunless %}{% endfor %}
      ]
    }
    </script>

    <!-- Loading Screen -->
    <div id="page-loader">
        <div class="spinner"></div>
    </div>

    {% include header.html %}
    {% include career.html %}
    {% include portfolio_grid.html %}
    {% include footer.html %}
    {% include js.html %}

    </body>
</html>
