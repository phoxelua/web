<!-- Portfolio Section -->
<section id="portfolio">
    <div class="section-container">
        <h2 class="section-heading reveal">Portfolio</h2>
        <div class="portfolio-grid">
            {% for post in site.posts %}
            <div class="portfolio-item reveal" style="--delay: {{ forloop.index | times: 0.1 }}s">
                <a href="{{ post.url }}" class="portfolio-link">
                    <img src="/img/portfolio/{{ post.thumbnail }}" alt="{{ post.title }} — {{ post.subtitle }}" width="400" height="300" loading="lazy">
                    <div class="portfolio-overlay">
                        <h3>{{ post.title }}</h3>
                        <p>{{ post.subtitle }}</p>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
