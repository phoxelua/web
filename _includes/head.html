<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - Software Engineer | AI/ML Infrastructure{% endif %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords" content="{{ site.keywords }}">
    <meta name="author" content="Howard Nguyen">
    <meta name="theme-color" content="#ffffff" id="theme-color-meta">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ site.favicon | prepend: site.baseurl }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ site.favicon | prepend: site.baseurl }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - Software Engineer{% endif %}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:image" content="{{ "/img/header-bg.jpg" | prepend: site.baseurl | prepend: site.url }}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <meta property="twitter:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - Software Engineer{% endif %}">
    <meta property="twitter:description" content="{{ site.description }}">
    <meta property="twitter:image" content="{{ "/img/header-bg.jpg" | prepend: site.baseurl | prepend: site.url }}">

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.google-analytics.com">

    <!-- Preload critical assets -->
    <link rel="preload" as="image" href="{{ "/img/header-bg.jpg" | prepend: site.baseurl }}">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <!-- Fonts: Inter -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ "/style.css" | prepend: site.baseurl }}">
</head>
