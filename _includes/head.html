<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - Software Engineer | AI/ML Infrastructure{% endif %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="keywords" content="{% if page.technologies %}{{ page.technologies | join: ', ' }}, {{ page.topics | join: ', ' }}, {% endif %}{{ site.keywords }}">
    <meta name="author" content="Howard Nguyen">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ site.favicon | prepend: site.baseurl }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ site.favicon | prepend: site.baseurl }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% if page.layout == 'project' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - Software Engineer{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{% if page.thumbnail %}{{ "/img/portfolio/" | append: page.thumbnail | prepend: site.baseurl | prepend: site.url }}{% else %}{{ "/img/header-bg.jpg" | prepend: site.baseurl | prepend: site.url }}{% endif %}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <meta property="twitter:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - Software Engineer{% endif %}">
    <meta property="twitter:description" content="{{ page.description | default: site.description }}">
    <meta property="twitter:image" content="{% if page.thumbnail %}{{ "/img/portfolio/" | append: page.thumbnail | prepend: site.baseurl | prepend: site.url }}{% else %}{{ "/img/header-bg.jpg" | prepend: site.baseurl | prepend: site.url }}{% endif %}">

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.google-analytics.com">

    <!-- Fonts: Inter (display=swap renders text immediately with system font) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <!-- Inline CSS (eliminates stylesheet request) -->
    <style>{% include css/agency.css %}</style>
</head>
