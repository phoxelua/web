<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#475569"/></marker>
    <marker id="ap" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#a78bfa"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#4ade80"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#fb923c"/></marker>
    <marker id="ay" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#fbbf24"/></marker>
  </defs>

  <rect width="960" height="760" fill="#0f172a" rx="8"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">hobbit</text>
  <text x="480" y="48" text-anchor="middle" fill="#64748b" font-size="11">Debian 13  ·  Ryzen 5 5500U  ·  32 GB RAM  ·  &lt;LAN_IP&gt;</text>

  <!-- ====== CLIENTS ====== -->
  <rect x="140" y="68" width="170" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="225" y="88" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">LAN Clients</text>
  <text x="225" y="102" text-anchor="middle" fill="#64748b" font-size="10">DNS via DHCP</text>

  <rect x="700" y="68" width="190" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="795" y="88" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Tailscale Devices</text>
  <text x="795" y="102" text-anchor="middle" fill="#64748b" font-size="10">via &lt;TS_IP&gt;</text>

  <!-- Client to ingress arrows -->
  <line x1="225" y1="110" x2="225" y2="148" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="795" y1="110" x2="795" y2="148" stroke="#a78bfa" stroke-width="1" marker-end="url(#ap)"/>

  <!-- ====== INGRESS ====== -->
  <rect x="80" y="130" width="860" height="72" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="100" y="148" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1">INGRESS</text>

  <rect x="100" y="152" width="380" height="40" rx="5" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="290" y="177" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Caddy  ·  :443 HTTPS  ·  :80 redirect  ·  Internal CA</text>

  <rect x="700" y="152" width="220" height="40" rx="5" fill="#3b0764" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="810" y="177" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Tailscale  ·  serve --bg 8096</text>

  <!-- Caddy down to proxy network -->
  <line x1="290" y1="192" x2="290" y2="238" stroke="#0ea5e9" stroke-width="1" marker-end="url(#a)" opacity="0.6"/>
  <text x="298" y="222" fill="#0ea5e9" font-size="9">routes *.lan</text>

  <!-- DNS arrow: LAN -> left gutter -> down -> right to AdGuard (avoids all boxes) -->
  <path d="M140,89 L28,89 L28,310 L65,310" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ay)" stroke-dasharray="4,3"/>
  <text x="36" y="210" fill="#fbbf24" font-size="9" writing-mode="tb">DNS :53</text>

  <!-- Tailscale straight down to Jellyfin -->
  <line x1="810" y1="192" x2="810" y2="278" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ap)" stroke-dasharray="4,3"/>
  <text x="822" y="240" fill="#a78bfa" font-size="9">bypass</text>

  <!-- ====== DOCKER NETWORK: PROXY ====== -->
  <rect x="45" y="238" width="640" height="240" rx="8" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="65" y="258" fill="#3b82f6" font-size="10" font-weight="600" letter-spacing="1">DOCKER NETWORK: PROXY</text>

  <!-- Jellyfin zone (also proxy network, right column) -->
  <rect x="715" y="238" width="220" height="240" rx="8" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Row 1 -->
  <rect x="65" y="272" width="190" height="82" rx="6" fill="#1e293b" stroke="#d97706"/>
  <text x="160" y="294" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">AdGuard Home</text>
  <line x1="85" y1="302" x2="235" y2="302" stroke="#2a2a3a" stroke-width="0.5"/>
  <text x="160" y="318" text-anchor="middle" fill="#94a3b8" font-size="10">adguard.lan  ·  :80 web</text>
  <text x="160" y="334" text-anchor="middle" fill="#fbbf24" font-size="10">:53 TCP+UDP exposed</text>
  <text x="160" y="348" text-anchor="middle" fill="#64748b" font-size="10">*.lan -> &lt;LAN_IP&gt;</text>

  <rect x="275" y="272" width="190" height="82" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="370" y="294" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Dozzle</text>
  <line x1="295" y1="302" x2="445" y2="302" stroke="#2a2a3a" stroke-width="0.5"/>
  <text x="370" y="318" text-anchor="middle" fill="#94a3b8" font-size="10">dozzle.lan  ·  :8080</text>
  <text x="370" y="334" text-anchor="middle" fill="#64748b" font-size="10">docker.sock :ro</text>

  <rect x="475" y="272" width="190" height="82" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="570" y="294" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Beszel Hub</text>
  <line x1="495" y1="302" x2="645" y2="302" stroke="#2a2a3a" stroke-width="0.5"/>
  <text x="570" y="318" text-anchor="middle" fill="#94a3b8" font-size="10">beszel.lan  ·  :8090</text>
  <text x="570" y="334" text-anchor="middle" fill="#64748b" font-size="10">PocketBase SQLite</text>

  <!-- Jellyfin (right column) -->
  <rect x="735" y="278" width="180" height="82" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="825" y="300" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Jellyfin</text>
  <line x1="755" y1="308" x2="895" y2="308" stroke="#2a2a3a" stroke-width="0.5"/>
  <text x="825" y="324" text-anchor="middle" fill="#94a3b8" font-size="10">jellyfin.lan  ·  :8096</text>
  <text x="825" y="340" text-anchor="middle" fill="#64748b" font-size="10">/mnt/media :ro</text>
  <text x="825" y="354" text-anchor="middle" fill="#64748b" font-size="10">loopback only</text>

  <!-- Row 2 -->
  <rect x="65" y="374" width="190" height="82" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="396" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Uptime Kuma</text>
  <line x1="85" y1="404" x2="235" y2="404" stroke="#2a2a3a" stroke-width="0.5"/>
  <text x="160" y="420" text-anchor="middle" fill="#94a3b8" font-size="10">uptime.lan  ·  :3001</text>
  <text x="160" y="436" text-anchor="middle" fill="#64748b" font-size="10">SQLite</text>

  <rect x="275" y="374" width="190" height="82" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="370" y="396" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Homepage</text>
  <line x1="295" y1="404" x2="445" y2="404" stroke="#2a2a3a" stroke-width="0.5"/>
  <text x="370" y="420" text-anchor="middle" fill="#94a3b8" font-size="10">home.lan  ·  :3000</text>
  <text x="370" y="436" text-anchor="middle" fill="#64748b" font-size="10">docker.sock :ro  ·  ./config</text>

  <!-- ====== HOST NETWORK ====== -->
  <text x="680" y="502" fill="#f97316" font-size="9" text-anchor="end">HOST NETWORK</text>
  <rect x="475" y="506" width="210" height="58" rx="6" fill="#1e293b" stroke="#f97316" stroke-dasharray="4,3"/>
  <text x="580" y="526" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Beszel Agent</text>
  <line x1="495" y1="534" x2="665" y2="534" stroke="#2a2a3a" stroke-width="0.5"/>
  <text x="580" y="550" text-anchor="middle" fill="#94a3b8" font-size="10">:45876  ·  network_mode: host  ·  docker.sock :ro</text>

  <!-- Agent -> Hub (straight up) -->
  <line x1="570" y1="506" x2="570" y2="354" stroke="#fb923c" stroke-width="1" marker-end="url(#ao)" stroke-dasharray="3,3"/>

  <!-- ====== STORAGE ====== -->
  <rect x="30" y="590" width="900" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="612" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1">STORAGE</text>

  <rect x="60" y="624" width="380" height="66" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="250" y="648" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">/dev/nvme0n1  ·  NVMe SSD  ·  477 GB</text>
  <text x="250" y="668" text-anchor="middle" fill="#64748b" font-size="10">p1: /boot/efi (1 GB FAT32)  ·  p2: / root (451 GB ext4)  ·  p3: swap (25 GB)</text>
  <text x="250" y="682" text-anchor="middle" fill="#64748b" font-size="10">OS + Docker volumes + containers</text>

  <rect x="520" y="624" width="380" height="66" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="710" y="648" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">/dev/sda1  ·  External HDD (ext4)  ·  932 GB</text>
  <text x="710" y="668" text-anchor="middle" fill="#4ade80" font-size="10">Label: MEDIA  ·  Mount: /mnt/media</text>
  <text x="710" y="682" text-anchor="middle" fill="#64748b" font-size="10">Media library (movies, music, photos)</text>

  <!-- sda1 -> Jellyfin (straight up right side) -->
  <line x1="825" y1="624" x2="825" y2="360" stroke="#4ade80" stroke-width="1.5" marker-end="url(#ag)" stroke-dasharray="4,3"/>
  <text x="838" y="500" fill="#4ade80" font-size="9">bind :ro</text>

  <!-- ====== LEGEND ====== -->
  <rect x="30" y="722" width="900" height="28" rx="5" fill="#1e293b" stroke="#334155"/>

  <line x1="50" y1="736" x2="72" y2="736" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="77" y="740" fill="#94a3b8" font-size="10">Caddy routes</text>

  <line x1="170" y1="736" x2="192" y2="736" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="197" y="740" fill="#94a3b8" font-size="10">Tailscale bypass</text>

  <line x1="315" y1="736" x2="337" y2="736" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="342" y="740" fill="#94a3b8" font-size="10">DNS :53</text>

  <line x1="410" y1="736" x2="432" y2="736" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="437" y="740" fill="#94a3b8" font-size="10">Storage mount</text>

  <line x1="550" y1="736" x2="572" y2="736" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="577" y="740" fill="#94a3b8" font-size="10">Host network</text>

  <rect x="680" y="730" width="12" height="12" rx="2" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="698" y="740" fill="#94a3b8" font-size="10">proxy network</text>
</svg>
